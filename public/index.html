<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="theme-color">
    <!--
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <!--
      Preconnect to essential domains
    -->
    <link rel="preconnect" href="https://bsky.social">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/skyanchor-192.png">
    <!-- let js set by leaving empty -->
    <title>SkyAnchor</title>
    <meta name="description" content="SkyAnchor: an independent Bluesky client that keeps your reading place." />

    <link rel="preload" as="font" type="font/woff2" href="/assets/assets/fonts/inter/InterVariable.woff2" crossorigin>

    <style>
      /**
       * Minimum styles required to render splash.
       *
       * ALL OTHER STYLES BELONG IN `src/style.css`
       *
       * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
       */
      @font-face {
        font-family: 'InterVariable';
        src: url(/assets/assets/fonts/inter/InterVariable.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'InterVariableItalic';
        src: url(/assets/assets/fonts/inter/InterVariable-Italic.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: italic;
        font-display: swap;
      }
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        /* Platform-specific reset */
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        font-synthesis-weight: none;
      }
      :root {
        --text: black;
        --background: white;
        --backgroundLight: #e2e7ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --text: white;
          --background: black;
          --backgroundLight: #232e3e;
        }
      }
      html,
      body,
      #root {
        display: flex;
        flex: 1 0 auto;
        min-height: 100%;
        width: 100%;
      }
      html.theme--light,
      html.theme--light body,
      html.theme--light #root {
        background-color: white;
        --text: black;
        --background: white;
        --backgroundLight: #DCE2EA;
      }
      html.theme--dark,
      html.theme--dark body,
      html.theme--dark #root {
        color-scheme: dark;
        background-color: black;
        --text: white;
        --background: black;
        --backgroundLight: #232E3E;
      }
      html.theme--dim,
      html.theme--dim body,
      html.theme--dim #root {
        color-scheme: dark;
        background-color: #151D28;
        --text: white;
        --background: #151D28;
        --backgroundLight: #2C3A4E;
      }
      #splash {
        display: flex;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        align-items: center;
        justify-content: center;
      }
      #splash svg {
        position: relative;
        top: -50px;
        width: 100px;
      }
      /**
       * We need these styles to prevent shifting due to scrollbar show/hide on
       * OSs that have them enabled by default. This also handles cases where the
       * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
       * shift the content, by forcing the page to show a scrollbar.
       */
      body {
        width: 100%;
        overflow-y: scroll;
      }
    </style>
    <script>
      const theme = localStorage.getItem('ALF_THEME')
      if (theme) {
        document.documentElement.classList.add(`theme--${theme}`)
      }
    </script>
  </head>

  <body>
    <!--
      A generic no script element with a reload button and a message.
      Feel free to customize this however you'd like.
    -->
    <noscript>
      <form
        action=""
        style="
          background-color: #fff;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <h1 lang="en">SkyAnchor</h1>
          <p lang="en">Social media as it should be. Find your community among millions of users, unleash your creativity, and have some fun again.</p>
          <div data-nosnippet>
            <p lang="en">Enable JavaScript to use SkyAnchor.</p>
            <p lang="en" style="margin: 20px 0;">
              <button
                type="submit"
                style="
                  background-color: #4630eb;
                  border-radius: 100px;
                  border: none;
                  box-shadow: none;
                  color: #fff;
                  cursor: pointer;
                  font-weight: bold;
                  line-height: 20px;
                  padding: 6px 16px;
                "
              >
                Reload
              </button>
            </p>
          </div>
        </div>
      </form>
    </noscript>

    <!-- The root element for your Expo app. -->
    <div id="splash">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#287c87" d="M12 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM11 8v10c-4-.4-6-2.5-6-6H2c0 6 4 10 10 10s10-4 10-10h-3c0 3.5-2 5.6-6 6V8h-2Z"/></svg>
    </div>
    <div id="root">
    </div>
    <form id="startup-failure" action="" hidden lang="en" aria-label="Startup recovery">
      <div role="alert">
        <h1>SkyAnchor</h1>
        <p>Startup is taking longer than expected.</p>
        <p>Check your connection, then retry. Your saved account and reading place will not be cleared.</p>
        <button type="submit">Retry</button>
      </div>
    </form>
    <style>
      #startup-failure:not([hidden]) {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 10000;
        align-items: center;
        justify-content: center;
        background: var(--background);
        color: var(--text);
        padding: 24px;
      }
      #startup-failure div { max-width: 32rem; }
      #startup-failure button {
        background: #287c87;
        color: white;
        border: 0;
        border-radius: 24px;
        font: inherit;
        padding: 12px 24px;
        cursor: pointer;
      }
    </style>
    <script>
      ;(() => {
        let started = Date.now()
        let timer
        let blocked = false
        const fallback = document.getElementById('startup-failure')
        fallback.addEventListener('submit', event => {
          event.preventDefault()
          window.location.reload()
        })
        const check = () => {
          if (!blocked && Date.now() - started >= 15000) fallback.hidden = false
        }
        const arm = () => { timer = setTimeout(check, 15000) }
        const phase = event => {
          if (event.detail === 'ready') {
            clearTimeout(timer)
            fallback.remove()
            window.removeEventListener('skyanchor-startup', phase)
            window.removeEventListener('pageshow', check)
            document.removeEventListener('visibilitychange', check)
          } else if (event.detail === 'blocked') {
            blocked = true
            clearTimeout(timer)
            fallback.hidden = true
          } else if (event.detail === 'retry') {
            blocked = false
            started = Date.now()
            clearTimeout(timer)
            arm()
          }
        }
        window.addEventListener('skyanchor-startup', phase)
        window.addEventListener('pageshow', check)
        document.addEventListener('visibilitychange', check)
        arm()
      })()
    </script>
  </body>
</html>
