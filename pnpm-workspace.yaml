nodeLinker: 'hoisted'
autoInstallPeers: true # default: true
strictPeerDependencies: false # default: false
packageExtensions:
  eslint-plugin-react-native-a11y:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-simple-import-sort:
    peerDependenciesMeta:
      eslint:
        optional: true
trustPolicy: 'no-downgrade' # default: off
trustPolicyIgnoreAfter: 10080 # 7 days, default: undefined
pmOnFail: download # run the pnpm version pinned in devEngines; package.json keeps onFail: warn because npm/npx read it too
overrides:
  'zod@^3': '3.25.76'
  'zod@^4': '4.6.6'
  'undici@^7': '7.30.1'
  'ajv@^8': '8.18.0'
  'ws@^8': '8.21.0'
  'ws@^7': '7.5.11'
  'shell-quote@^1': '1.11.0'
  'tar@^7': '7.5.21'
  'markdown-it@^14': '14.3.3'
  'linkify-it@^5': '5.0.2'
  'js-yaml@^4': '4.3.2'
  'js-yaml@^3': '3.15.2'
  '@babel/core@^7': '7.29.6'
  'brace-expansion@^2': '2.1.7'
  'brace-expansion@^1': '1.1.21'
  'brace-expansion@^5': '5.0.12'
  'fast-uri@^3': '3.1.9'
  'browserslist@^4': '4.28.7'
  '@xmldom/xmldom@^0.9': '0.9.12'
  '@xmldom/xmldom@^0.8': '0.8.15'
  'baseline-browser-mapping@^2': '2.11.0'
  'svgo@^4': '4.1.0'
  'node-forge@^1': '1.4.3'
  'source-map-js@^1': '1.2.2'
  'proxy-addr@^2': '2.0.8'
  'compression@^1': '1.8.2'
  'body-parser@^1': '1.20.9'
  'qs': '6.16.1'
  'decode-uri-component': '0.5.1'
  'prosemirror-view': '1.42.3'
  'prosemirror-model': '1.25.12'
  '@react-native/babel-preset': '0.88.0'
  '@react-native/normalize-colors': '0.88.0'
  '@expo/image-utils': '0.12.5'
  '@types/estree': '1.0.6'
  'react-native-reanimated': '4.7.1'
  'react-native-worklets': '0.13.0'
  'psl': '1.9.0'
  '@types/psl': '1.1.1'
  'react-native-screens': '4.30.0'
allowBuilds:
  'workerd': true
  'sharp': true
  '@sentry/cli': true
  '@swc/core': false
  'core-js': false
  'core-js-pure': false
  'dtrace-provider': false
  'esbuild': false
  '@parcel/watcher': false
  'protobufjs': false
  'unrs-resolver': true
patchedDependencies:
  'zod@3.25.76': patches/zod@3.25.76.patch
  '@expo/cli@58.1.15': patches/@expo__cli@58.1.15.patch
  '@expo/ui@58.0.23': patches/@expo__ui@58.0.23.patch
  '@formatjs/bigdecimal@0.2.5': patches/@formatjs__bigdecimal@0.2.5.patch
  '@sentry/expo-upload-sourcemaps@8.26.0': patches/@sentry__expo-upload-sourcemaps@8.26.0.patch
  'expo-image@58.0.17': patches/expo-image@58.0.17.patch
