name: Workflow security

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

# The github.token is only used by zizmor's online audits (read-only API calls)
permissions:
  contents: read

jobs:
  zizmor:
    name: Audit workflows with zizmor
    if: github.repository == 'MichaelEns/skyanchor-public' && github.event.repository.private == false && vars.SKYANCHOR_ZERO_SPEND_VERIFIED == 'true' && vars.SKYANCHOR_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Temporary until fixed runner images roll out:
      # https://github.com/actions/runner-images/issues/15018
      - name: Update Ubuntu CA certificates
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade --no-install-recommends -y ca-certificates

      - name: ⬇️ Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1

      - name: Verify trusted public policy
        run: node scripts/skyanchor/upstream.mjs candidate-policy
        env:
          GH_TOKEN: ${{ github.token }}
          SKYANCHOR_AUTOMATION_ENABLED: ${{ vars.SKYANCHOR_AUTOMATION_ENABLED }}
          SKYANCHOR_ZERO_SPEND_VERIFIED: ${{ vars.SKYANCHOR_ZERO_SPEND_VERIFIED }}
          SKYANCHOR_ZERO_SPEND_EVIDENCE: ${{ vars.SKYANCHOR_ZERO_SPEND_EVIDENCE }}
          SKYANCHOR_FORK_APPROVAL_VERIFIED: ${{ vars.SKYANCHOR_FORK_APPROVAL_VERIFIED }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🛡️ Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Annotate the PR directly instead of uploading SARIF to the
          # security tab, and fail the check on any finding
          advanced-security: false
          annotations: true
          # Low-confidence findings (e.g. artipacked on workflows that never
          # push) are too noisy to gate CI on
          min-confidence: medium
