name: SkyAnchor exact candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 9 * * 1'
permissions:
  contents: read
concurrency:
  group: skyanchor-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: SkyAnchor exact candidate
    if: github.repository == 'MichaelEns/skyanchor-public' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Require owner activation before checkout
        shell: pwsh
        env:
          ENABLED: ${{ vars.SKYANCHOR_AUTOMATION_ENABLED }}
          ZERO_SPEND: ${{ vars.SKYANCHOR_ZERO_SPEND_VERIFIED }}
          FORK_APPROVAL: ${{ vars.SKYANCHOR_FORK_APPROVAL_VERIFIED }}
          ADMIN_POLICY: ${{ vars.SKYANCHOR_ADMIN_POLICY_ATTESTATION }}
          BUDGET_EVIDENCE: ${{ vars.SKYANCHOR_ZERO_SPEND_EVIDENCE }}
        run: |
          if ($env:ENABLED -ne 'true' -or $env:ZERO_SPEND -ne 'true' -or $env:FORK_APPROVAL -ne 'true' -or [string]::IsNullOrWhiteSpace($env:ADMIN_POLICY) -or $env:BUDGET_EVIDENCE -notmatch '^https://github\.com/MichaelEns/skyanchor-public/issues/[1-9]\d*$') {
            throw 'Owner activation and verified setup evidence required; required check must fail, not skip'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: node scripts\skyanchor\upstream.mjs candidate-policy
        env:
          GH_TOKEN: ${{ github.token }}
          SKYANCHOR_AUTOMATION_ENABLED: ${{ vars.SKYANCHOR_AUTOMATION_ENABLED }}
          SKYANCHOR_ZERO_SPEND_VERIFIED: ${{ vars.SKYANCHOR_ZERO_SPEND_VERIFIED }}
          SKYANCHOR_ZERO_SPEND_EVIDENCE: ${{ vars.SKYANCHOR_ZERO_SPEND_EVIDENCE }}
          SKYANCHOR_FORK_APPROVAL_VERIFIED: ${{ vars.SKYANCHOR_FORK_APPROVAL_VERIFIED }}
          SKYANCHOR_ADMIN_POLICY_ATTESTATION: ${{ vars.SKYANCHOR_ADMIN_POLICY_ATTESTATION }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.28.5
          standalone: false
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - run: pnpm exec playwright install chromium webkit
      - name: Resolve installed pnpm executable
        shell: pwsh
        run: |
          $candidates = @(Get-Command pnpm -CommandType Application -ErrorAction Stop | Select-Object -ExpandProperty Source)
          $env:SKYANCHOR_PNPM_CANDIDATES = ConvertTo-Json -InputObject $candidates -Compress
          $binary = @(node scripts/skyanchor/pnpm-cli.mjs resolve)
          if ($LASTEXITCODE -ne 0 -or $binary.Count -ne 1) { throw 'Pinned pnpm discovery failed' }
          "SKYANCHOR_PNPM_BINARY=$($binary[0])" >> $env:GITHUB_ENV
      - run: pnpm skyanchor:verify
