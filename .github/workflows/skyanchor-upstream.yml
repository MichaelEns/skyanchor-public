name: SkyAnchor official releases
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skyanchor-upstream
  cancel-in-progress: false
env:
  SKYANCHOR_AUTOMATION_ENABLED: ${{ vars.SKYANCHOR_AUTOMATION_ENABLED }}
  SKYANCHOR_ZERO_SPEND_VERIFIED: ${{ vars.SKYANCHOR_ZERO_SPEND_VERIFIED }}
  SKYANCHOR_ZERO_SPEND_EVIDENCE: ${{ vars.SKYANCHOR_ZERO_SPEND_EVIDENCE }}
  SKYANCHOR_FORK_APPROVAL_VERIFIED: ${{ vars.SKYANCHOR_FORK_APPROVAL_VERIFIED }}
  SKYANCHOR_ADMIN_POLICY_ATTESTATION: ${{ vars.SKYANCHOR_ADMIN_POLICY_ATTESTATION }}
jobs:
  inspect:
    if: github.repository == 'MichaelEns/skyanchor-public' && github.event.repository.private == false && vars.SKYANCHOR_ZERO_SPEND_VERIFIED == 'true' && vars.SKYANCHOR_AUTOMATION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.inspect.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - id: inspect
        run: node scripts\skyanchor\upstream.mjs inspect
        env:
          GH_TOKEN: ${{ github.token }}
  verify:
    needs: inspect
    if: github.repository == 'MichaelEns/skyanchor-public' && github.event.repository.private == false && vars.SKYANCHOR_ZERO_SPEND_VERIFIED == 'true' && vars.SKYANCHOR_AUTOMATION_ENABLED == 'true' && fromJSON(needs.inspect.outputs.plan).trivial == true
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      receipt: ${{ steps.verify.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: node scripts\skyanchor\upstream.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SKYANCHOR_PLAN: ${{ needs.inspect.outputs.plan }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.28.5
          standalone: false
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - run: pnpm exec playwright install chromium webkit
      - name: Resolve installed pnpm executable
        shell: pwsh
        run: |
          $candidates = @(Get-Command pnpm -CommandType Application -ErrorAction Stop | Select-Object -ExpandProperty Source)
          $env:SKYANCHOR_PNPM_CANDIDATES = ConvertTo-Json -InputObject $candidates -Compress
          $binary = @(node scripts/skyanchor/pnpm-cli.mjs resolve)
          if ($LASTEXITCODE -ne 0 -or $binary.Count -ne 1) { throw 'Pinned pnpm discovery failed' }
          "SKYANCHOR_PNPM_BINARY=$($binary[0])" >> $env:GITHUB_ENV
      - id: verify
        run: pnpm skyanchor:verify
  publish:
    needs: [inspect, verify]
    if: always() && github.repository == 'MichaelEns/skyanchor-public' && github.event.repository.private == false && vars.SKYANCHOR_ZERO_SPEND_VERIFIED == 'true' && vars.SKYANCHOR_AUTOMATION_ENABLED == 'true' && needs.inspect.result == 'success' && fromJSON(needs.inspect.outputs.plan).updates == true && (needs.verify.result == 'success' || fromJSON(needs.inspect.outputs.plan).trivial == false)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: node scripts\skyanchor\upstream.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          SKYANCHOR_PLAN: ${{ needs.inspect.outputs.plan }}
          SKYANCHOR_RECEIPT: ${{ needs.verify.outputs.receipt }}
